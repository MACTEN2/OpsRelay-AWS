apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsrelay-deployment
  labels:
    app: opsrelay-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opsrelay-app
  template:
    metadata:
      labels:
        app: opsrelay-app
    spec:
      containers:
      - name: opsrelay-container
        image: opsrelay-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5